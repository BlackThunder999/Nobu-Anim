<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>РАДИО ХАМАМ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Модалка 3-секундного коннекта */
    #connecting-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .loader {
      width: 32px;
      height: 32px;
      border: 2px solid #222222;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .connecting-text {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888888;
    }

    /* Шапка */
    header {
      padding: 30px 20px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #141414;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #ffffff;
      border-radius: 50%;
    }

    /* Центральная часть */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
    }

    .view {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .view.active {
      display: flex;
    }

    .station-wave {
      font-size: 11px;
      letter-spacing: 2px;
      color: #555555;
      margin-bottom: 6px;
    }

    .track-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 30px;
      height: 20px;
    }

    /* Прогресс-бар */
    .progress-container {
      width: 100%;
      max-width: 320px;
      margin-bottom: 35px;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #666666;
      margin-bottom: 10px;
      font-variant-numeric: tabular-nums;
    }

    .seekbar-wrap {
      position: relative;
      width: 100%;
      height: 24px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .seekbar-bg {
      width: 100%;
      height: 2px;
      background: #222222;
      position: relative;
    }

    .seekbar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: #ffffff;
      width: 0%;
    }

    .seekbar-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background: #ffffff;
      border-radius: 50%;
      left: 0%;
    }

    .live-tag {
      cursor: pointer;
      border: 1px solid #333333;
      padding: 1px 6px;
      border-radius: 2px;
      color: #666666;
      font-size: 10px;
    }

    .live-tag.active {
      border-color: #ffffff;
      color: #ffffff;
    }

    /* Блок с Меллом и кнопкой */
    .player-deck {
      position: relative;
      width: 190px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid #1a1a1a;
      background: #000000;
      overflow: hidden;
    }

    .deck-bg {
      position: absolute;
      inset: 0;
      background-image: url('IMG_3320.JPG');
      background-size: cover;
      background-position: center;
      filter: grayscale(100%) brightness(0.35);
      z-index: 1;
    }

    .play-btn {
      position: relative;
      z-index: 2;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 1px solid #ffffff;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .play-btn:active {
      transform: scale(0.94);
      background: #ffffff;
      color: #000000;
    }

    .play-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Заглушка Nobu FM */
    .service-box {
      border: 1px solid #1a1a1a;
      padding: 30px 20px;
      text-align: center;
      max-width: 280px;
      width: 100%;
    }

    .service-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .service-desc {
      font-size: 11px;
      color: #666666;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .switch-back-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 8px 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
    }

    /* Нижняя навигация */
    nav {
      border-top: 1px solid #141414;
      display: flex;
      background: #000000;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .tab-btn {
      flex: 1;
      padding: 16px 0;
      background: none;
      border: none;
      color: #444444;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .tab-btn.active {
      color: #ffffff;
      border-top: 1px solid #ffffff;
    }
  </style>
</head>
<body>

  <div id="connecting-modal">
    <div class="loader"></div>
    <div class="connecting-text">ПОДКЛЮЧАЕМСЯ...</div>
  </div>

  <header>
    <div class="brand-title">РАДИО ХАМАМ</div>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span>104.2 FM</span>
    </div>
  </header>

  <main>
    <section id="view-hamam" class="view active">
      <div class="station-wave">ЭФИР</div>
      <div class="track-title" id="now-playing">ЭФИР</div>

      <div class="progress-container">
        <div class="time-labels">
          <span id="time-current">00:00</span>
          <span id="live-indicator" class="live-tag active">LIVE</span>
          <span id="time-total">00:00</span>
        </div>
        
        <div class="seekbar-wrap" id="seekbar-touch">
          <div class="seekbar-bg">
            <div class="seekbar-fill" id="seek-fill"></div>
            <div class="seekbar-thumb" id="seek-thumb"></div>
          </div>
        </div>
      </div>

      <div class="player-deck">
        <div class="deck-bg"></div>
        <button class="play-btn" id="main-play-btn" aria-label="Пуск">
          <svg id="play-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </button>
      </div>
    </section>

    <section id="view-nobu" class="view">
      <div class="service-box">
        <div class="service-title">NOBU FM</div>
        <div class="service-desc">ИДУТ РАБОТЫ.<br>СКОРО В ЭФИРЕ.</div>
        <button class="switch-back-btn" id="btn-back-hamam">НА ХАМАМ FM</button>
      </div>
    </section>
  </main>

  <nav>
    <button class="tab-btn active" id="tab-hamam">ХАМАМ FM</button>
    <button class="tab-btn" id="tab-nobu">NOBU FM</button>
  </nav>

  <audio id="audio-engine" preload="auto"></audio>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // Все твои файлы из репозитория
    const PLAYLIST = [
      { name: "ТРЕК #1 (20 МИН)", file: "ssstik.io_@ISSDD_7689597148920352006.mp3" },
      { name: "РЕКЛАМА #1 (ТГ)", file: "tts_1794059996527_2.wav" },
      { name: "ТРЕК #2", file: "ssstik.io_@gevenjilussko_7663545560258858262.mp3" },
      { name: "РЕКЛАМА #2 (ТГ)", file: "tts_1794060362348_6.wav" },
      { name: "ТРЕК #1 (20 МИН)", file: "ssstik.io_@ISSDD_7689597148920352006.mp3" },
      { name: "РЕКЛАМА #3 (ТГ)", file: "tts_1794060639757_8.wav" },
      { name: "ТРЕК #2", file: "ssstik.io_@gevenjilussko_7663545560258858262.mp3" },
      { name: "РЕКЛАМА PLAYEROK", file: "tts_1794060925086_11 2.wav" },
      { name: "КОНЕЦ ЛЕНТЫ", file: "tts_1794061684960_13.wav" }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let isLive = true;
    let connected = false;

    const audio = document.getElementById('audio-engine');
    const playBtn = document.getElementById('main-play-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const modal = document.getElementById('connecting-modal');
    const nowPlaying = document.getElementById('now-playing');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    const seekFill = document.getElementById('seek-fill');
    const seekThumb = document.getElementById('seek-thumb');
    const liveTag = document.getElementById('live-indicator');

    function fmt(s) {
      if (isNaN(s) || s < 0) return "00:00";
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    // Четкое экранирование для iOS Safari: сохраняет @ и кодирует пробелы
    function getSafeSrc(filename) {
      return './' + encodeURIComponent(filename).replace(/%40/g, '@');
    }

    function playTrack(index) {
      currentIndex = (index + PLAYLIST.length) % PLAYLIST.length;
      const track = PLAYLIST[currentIndex];
      nowPlaying.textContent = track.name;

      audio.src = getSafeSrc(track.file);
      audio.load();

      const p = audio.play();
      if (p !== undefined) {
        p.catch(() => {
          setTimeout(() => {
            if (isPlaying) playTrack(currentIndex + 1);
          }, 300);
        });
      }
    }

    audio.addEventListener('ended', () => {
      playTrack(currentIndex + 1);
    });

    audio.addEventListener('error', () => {
      if (isPlaying) {
        playTrack(currentIndex + 1);
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const cur = audio.currentTime;
      const dur = audio.duration;
      timeCurrent.textContent = fmt(cur);
      timeTotal.textContent = fmt(dur - cur);

      const pct = (cur / dur) * 100;
      seekFill.style.width = pct + '%';
      seekThumb.style.left = pct + '%';
    });

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        return;
      }

      if (!connected) {
        modal.style.display = 'flex';
        // Прогреваем контекст айфона сразу по первому клику
        audio.src = getSafeSrc(PLAYLIST[0].file);
        audio.load();

        setTimeout(() => {
          modal.style.display = 'none';
          connected = true;
          isPlaying = true;
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
          playTrack(0);
        }, 3000);
      } else {
        isPlaying = true;
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        if (!audio.src || audio.src === window.location.href) {
          playTrack(currentIndex);
        } else {
          audio.play().catch(() => playTrack(currentIndex));
        }
      }
    });

    const seekTouch = document.getElementById('seekbar-touch');
    seekTouch.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = seekTouch.getBoundingClientRect();
      const clickRatio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const targetTime = clickRatio * audio.duration;

      if (targetTime < audio.currentTime) {
        audio.currentTime = targetTime;
        isLive = false;
        liveTag.classList.remove('active');
      }
    });

    liveTag.addEventListener('click', () => {
      if (!isLive) {
        isLive = true;
        liveTag.classList.add('active');
        if (audio.duration) {
          audio.currentTime = Math.max(0, audio.duration - 1);
        }
      }
    });

    const tabHamam = document.getElementById('tab-hamam');
    const tabNobu = document.getElementById('tab-nobu');
    const viewHamam = document.getElementById('view-hamam');
    const viewNobu = document.getElementById('view-nobu');
    const btnBack = document.getElementById('btn-back-hamam');

    tabHamam.addEventListener('click', () => setTab('hamam'));
    btnBack.addEventListener('click', () => setTab('hamam'));
    tabNobu.addEventListener('click', () => setTab('nobu'));

    function setTab(tab) {
      if (tab === 'hamam') {
        tabHamam.classList.add('active');
        tabNobu.classList.remove('active');
        viewHamam.classList.add('active');
        viewNobu.classList.remove('active');
      } else {
        tabNobu.classList.add('active');
        tabHamam.classList.remove('active');
        viewNobu.classList.add('active');
        viewHamam.classList.remove('active');
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nyxflow Social</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #060709;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .custom-scroll::-webkit-scrollbar { display: none; }
    .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex justify-center h-screen w-screen overflow-hidden select-none bg-black">

  <div class="w-full max-w-md h-full flex flex-col bg-[#0b0d14] border-x border-[#1c2133] relative">

    <!-- ВЕРХНЯЯ ШАПКА -->
    <header class="px-4 py-3 flex justify-between items-center z-10 bg-[#0b0d14]/90 backdrop-blur-md border-b border-[#1c2133]">
      <div class="flex items-center gap-2">
        <h1 class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400">
          NYXFLOW
        </h1>
        <span id="admin-badge" class="hidden text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full bg-red-500/20 text-red-400 border border-red-500/40">
          Admin Panel
        </span>
      </div>
      <button id="logout-btn" class="text-xs text-gray-400 hover:text-white transition px-2 py-1 rounded bg-[#161a29] border border-[#272e47]">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> Выйти
      </button>
    </header>

    <!-- ОСНОВНОЙ СКРОЛЛ -->
    <main class="flex-1 overflow-y-auto custom-scroll relative">
      
      <!-- ВКЛАДКА: ЛЕНТА -->
      <section id="feed-page" class="p-3 space-y-3 pb-32">
        <div id="posts-container" class="space-y-3">
          <!-- Сюда генерятся посты из Supabase -->
        </div>
      </section>

      <!-- ВКЛАДКА: ПРОФИЛЬ -->
      <section id="profile-page" class="hidden pb-28">
        <!-- Баннер профиля -->
        <div class="relative h-36 w-full bg-[#161a29] border-b border-[#232a42] overflow-hidden group cursor-pointer" onclick="document.getElementById('banner-file-input').click()">
          <img id="profile-banner-img" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
            <span class="text-xs font-semibold bg-black/60 px-3 py-1.5 rounded-xl border border-white/20"><i class="fa-solid fa-camera mr-1"></i> Сменить баннер</span>
          </div>
          <input type="file" id="banner-file-input" accept="image/*" class="hidden">
        </div>

        <div class="px-4">
          <!-- Аватарка и Ник -->
          <div class="relative -mt-12 flex justify-between items-end mb-3">
            <div class="relative group cursor-pointer" onclick="document.getElementById('avatar-file-input').click()">
              <img id="profile-avatar-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80" 
                   class="w-24 h-24 rounded-full object-cover border-4 border-[#0b0d14] bg-[#161a29] shadow-xl">
              <div class="absolute inset-0 rounded-full bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                <i class="fa-solid fa-pen text-white text-xs"></i>
              </div>
              <input type="file" id="avatar-file-input" accept="image/*" class="hidden">
            </div>
            <div id="profile-role-tag" class="text-[11px] font-bold px-2.5 py-1 rounded-lg bg-purple-500/10 text-purple-400 border border-purple-500/30">
              Пользователь
            </div>
          </div>

          <h2 id="profile-username-header" class="text-lg font-black text-white">username</h2>
          <p class="text-xs text-gray-500 mb-4">Настраивай кастом под себя</p>

          <!-- Spotify Плеер -->
          <div id="spotify-player-box" class="hidden mb-4 rounded-xl overflow-hidden border border-[#232a42]">
            <iframe id="spotify-iframe" style="border-radius:12px" src="" width="100%" height="80" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
          </div>

          <!-- Настройки профиля -->
          <div class="bg-[#121522] border border-[#232a42] rounded-2xl p-4 space-y-3">
            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Кастомизация</p>
            <div>
              <label class="text-[11px] text-gray-400 block mb-1">Никнейм</label>
              <input type="text" id="edit-username-input" class="w-full bg-[#0b0d14] border border-[#29314d] rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
            </div>
            <div>
              <label class="text-[11px] text-gray-400 block mb-1">Ссылка на Spotify трек / альбом</label>
              <input type="text" id="edit-spotify-input" placeholder="https://open.spotify.com/track/..." class="w-full bg-[#0b0d14] border border-[#29314d] rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
            </div>
            <button id="save-profile-btn" class="w-full bg-purple-600 hover:bg-purple-700 active:scale-95 py-2.5 rounded-xl font-bold text-xs transition">
              Сохранить профиль
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- НИЖНЯЯ ПАНЕЛЬ СОЗДАНИЯ ПОСТА + НАВИГАЦИЯ -->
    <div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-[#0b0d14] via-[#0b0d14]/95 to-transparent">
      
      <!-- Превью выбранного фото/видео (до 25MB) -->
      <div id="file-preview-bar" class="hidden items-center justify-between bg-[#191e30] border border-[#2a3350] px-3 py-1.5 rounded-xl mb-2 text-xs">
        <span id="preview-filename" class="text-purple-300 font-medium truncate max-w-[200px]">file</span>
        <button id="cancel-file-btn" class="text-gray-400 hover:text-red-400"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- Ввод поста с круглым + -->
      <div id="post-creation-panel" class="flex items-center gap-2 bg-[#121522]/95 border border-[#232a42] p-2 rounded-2xl shadow-2xl mb-2">
        <input type="file" id="media-input" accept="image/*,video/*" class="hidden">
        <button id="choose-media-btn" title="Выбрать фото/видео (до 25MB)" 
                class="w-10 h-10 rounded-full bg-[#1c2133] hover:bg-purple-600 active:scale-90 text-purple-300 hover:text-white flex items-center justify-center transition border border-[#2e3754] flex-shrink-0">
          <i class="fa-solid fa-plus text-sm"></i>
        </button>
        <input type="text" id="post-content-input" placeholder="Что нового? Опубликуй..." 
               class="flex-1 bg-transparent border-0 text-sm px-2 text-white placeholder-gray-500 focus:outline-none">
        <button id="publish-btn" 
                class="w-10 h-10 rounded-full bg-purple-600 hover:bg-purple-700 active:scale-90 text-white flex items-center justify-center transition flex-shrink-0 shadow-lg shadow-purple-600/30">
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </div>

      <!-- Нижний переключатель страниц -->
      <nav class="flex justify-around items-center bg-[#10131d] border border-[#1e2438] rounded-xl py-1.5 px-3">
        <button id="nav-btn-feed" class="flex items-center gap-2 text-xs font-bold text-purple-400 py-1.5 px-4 rounded-lg bg-purple-500/10">
          <i class="fa-solid fa-stream"></i> Лента
        </button>
        <button id="nav-btn-profile" class="flex items-center gap-2 text-xs font-bold text-gray-400 py-1.5 px-4 rounded-lg hover:text-gray-200">
          <i class="fa-solid fa-user"></i> Профиль
        </button>
      </nav>
    </div>

    <!-- МОДАЛКА: ВХОД / РЕГИСТРАЦИЯ (БЕЗ ПОЧТЫ) -->
    <div id="auth-modal" class="hidden absolute inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
      <div class="w-full max-w-sm bg-[#121522] border border-[#28304a] rounded-3xl p-6 shadow-2xl">
        <h3 id="auth-title" class="text-xl font-black text-center mb-1 text-white">Вход в Nyxflow</h3>
        <p class="text-xs text-gray-400 text-center mb-5">Никакой почты — только ник и пароль</p>

        <div class="space-y-3">
          <div>
            <label class="text-[11px] text-gray-400 block mb-1">Никнейм</label>
            <input type="text" id="auth-username" class="w-full bg-[#0b0d14] border border-[#28304a] rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
          </div>
          <div>
            <label class="text-[11px] text-gray-400 block mb-1">Пароль</label>
            <input type="password" id="auth-password" class="w-full bg-[#0b0d14] border border-[#28304a] rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
          </div>

          <button id="auth-submit-btn" class="w-full bg-purple-600 hover:bg-purple-700 active:scale-95 py-3 rounded-xl font-black text-xs uppercase tracking-wider text-white transition mt-2 shadow-lg shadow-purple-600/30">
            Войти
          </button>

          <p id="auth-switch-text" class="text-xs text-center text-gray-400 mt-3 cursor-pointer hover:text-purple-300">
            Нет аккаунта? Создать в 1 клик
          </p>
        </div>
      </div>
    </div>

  </div>

  <script>
    // 1. Инициализация твоей Supabase
    const SUPABASE_URL = "https://mlcfgdnwnhpfosomeutj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_X5oXLmCQy0FpOMAs2nLWuQ_HY2yaZy5";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const MAX_MEDIA_SIZE = 25 * 1024 * 1024; // 25 MB
    let currentUser = JSON.parse(localStorage.getItem('nyxflow_session')) || null;
    let authIsRegisterMode = false;
    let selectedFile = null;

    // Хеширование sha256 на клиенте
    async function hashPassword(str) {
      const buffer = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Проверка сессии
    async function checkAuth() {
      if (!currentUser) {
        showAuthModal(false);
      } else {
        const { data: user, error } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
        if (error || !user || user.is_banned) {
          if (user?.is_banned) alert("⛔ Ваш аккаунт заблокирован администрацией!");
          logout();
          return;
        }
        currentUser = user;
        localStorage.setItem('nyxflow_session', JSON.stringify(user));
        hideAuthModal();
        applyUserUI();
        loadPosts();
      }
    }

    function applyUserUI() {
      if (currentUser.is_admin) {
        document.getElementById('admin-badge').classList.remove('hidden');
        document.getElementById('profile-role-tag').textContent = "👑 Создатель / Админ";
        document.getElementById('profile-role-tag').className = "text-[11px] font-bold px-2.5 py-1 rounded-lg bg-red-500/20 text-red-400 border border-red-500/40";
      } else {
        document.getElementById('admin-badge').classList.add('hidden');
        document.getElementById('profile-role-tag').textContent = "Пользователь";
        document.getElementById('profile-role-tag').className = "text-[11px] font-bold px-2.5 py-1 rounded-lg bg-purple-500/10 text-purple-400 border border-purple-500/30";
      }

      document.getElementById('profile-username-header').textContent = currentUser.username;
      document.getElementById('edit-username-input').value = currentUser.username;
      document.getElementById('profile-avatar-img').src = currentUser.avatar_url;
      document.getElementById('profile-banner-img').src = currentUser.banner_url;
      document.getElementById('edit-spotify-input').value = currentUser.spotify_url || '';
      renderSpotify(currentUser.spotify_url);
    }

    function renderSpotify(url) {
      const box = document.getElementById('spotify-player-box');
      const iframe = document.getElementById('spotify-iframe');
      if (!url) {
        box.classList.add('hidden');
        return;
      }
      // Преобразуем open.spotify.com/track/ID в embed
      const match = url.match(/spotify\.com\/(track|album|playlist)\/([a-zA-Z0-9]+)/);
      if (match) {
        iframe.src = `https://open.spotify.com/embed/${match[1]}/${match[2]}?utm_source=generator&theme=0`;
        box.classList.remove('hidden');
      } else {
        box.classList.add('hidden');
      }
    }

    // Авторизация / Регистрация
    function showAuthModal(isRegister = false) {
      authIsRegisterMode = isRegister;
      document.getElementById('auth-modal').classList.remove('hidden');
      document.getElementById('auth-title').textContent = isRegister ? "Создать аккаунт" : "Вход в Nyxflow";
      document.getElementById('auth-submit-btn').textContent = isRegister ? "Зарегистрироваться" : "Войти";
      document.getElementById('auth-switch-text').textContent = isRegister ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Создать в 1 клик";
    }

    function hideAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }

    document.getElementById('auth-switch-text').addEventListener('click', () => {
      showAuthModal(!authIsRegisterMode);
    });

    document.getElementById('auth-submit-btn').addEventListener('click', async () => {
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      if (!username || !password) return alert("Заполни ник и пароль!");

      const passwordHash = await hashPassword(password);

      if (authIsRegisterMode) {
        // Регистрация
        const { data, error } = await supabaseClient.from('profiles').insert([
          { username, password_hash: passwordHash }
        ]).select().single();

        if (error) return alert("Ошибка! Возможно такой ник уже занят.");
        currentUser = data;
        localStorage.setItem('nyxflow_session', JSON.stringify(data));
        location.reload();
      } else {
        // Вход
        const { data, error } = await supabaseClient.from('profiles').select('*')
          .eq('username', username)
          .eq('password_hash', passwordHash)
          .single();

        if (error || !data) return alert("Неверный ник или пароль!");
        if (data.is_banned) return alert("⛔ Аккаунт забанен навсегда!");

        currentUser = data;
        localStorage.setItem('nyxflow_session', JSON.stringify(data));
        location.reload();
      }
    });

    function logout() {
      localStorage.removeItem('nyxflow_session');
      location.reload();
    }
    document.getElementById('logout-btn').addEventListener('click', logout);

    // Загрузка фото/видео с лимитом 25 MB
    const mediaInput = document.getElementById('media-input');
    document.getElementById('choose-media-btn').addEventListener('click', () => mediaInput.click());

    mediaInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > MAX_MEDIA_SIZE) {
        alert("⚠️ Лимит 25 МБ! Сервер не принимает файлы тяжелее.");
        mediaInput.value = '';
        return;
      }
      selectedFile = file;
      document.getElementById('preview-filename').textContent = file.name;
      document.getElementById('file-preview-bar').classList.remove('hidden');
      document.getElementById('file-preview-bar').classList.add('flex');
    });

    document.getElementById('cancel-file-btn').addEventListener('click', () => {
      selectedFile = null;
      mediaInput.value = '';
      document.getElementById('file-preview-bar').classList.add('hidden');
      document.getElementById('file-preview-bar').classList.remove('flex');
    });

    // Отправка поста
    document.getElementById('publish-btn').addEventListener('click', async () => {
      const text = document.getElementById('post-content-input').value.trim();
      if (!text && !selectedFile) return;

      let mediaUrl = null;
      let mediaType = null;

      if (selectedFile) {
        const fileExt = selectedFile.name.split('.').pop();
        const filePath = `posts/${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
        
        const { error: uploadError } = await supabaseClient.storage
          .from('nyxflow-media')
          .upload(filePath, selectedFile);

        if (uploadError) return alert("Ошибка заливки медиа: " + uploadError.message);

        const { data: publicData } = supabaseClient.storage
          .from('nyxflow-media')
          .getPublicUrl(filePath);

        mediaUrl = publicData.publicUrl;
        mediaType = selectedFile.type.startsWith('video/') ? 'video' : 'image';
      }

      const { error: postError } = await supabaseClient.from('posts').insert([
        {
          user_id: currentUser.id,
          text: text,
          media_url: mediaUrl,
          media_type: mediaType
        }
      ]);

      if (postError) return alert("Ошибка отправки: " + postError.message);

      document.getElementById('post-content-input').value = '';
      selectedFile = null;
      mediaInput.value = '';
      document.getElementById('file-preview-bar').classList.add('hidden');
      document.getElementById('file-preview-bar').classList.remove('flex');
      loadPosts();
    });

    // Получение постов и рендер
    async function loadPosts() {
      const { data: posts, error } = await supabaseClient
        .from('posts')
        .select(`
          id, text, media_url, media_type, created_at, user_id,
          profiles ( id, username, avatar_url, is_admin, is_banned )
        `)
        .order('created_at', { ascending: false });

      if (error) return console.error(error);

      const container = document.getElementById('posts-container');
      container.innerHTML = '';

      posts.forEach(post => {
        // Пропускаем посты забаненных
        if (post.profiles?.is_banned) return;

        const card = document.createElement('article');
        card.className = "bg-[#121522] border border-[#232a42] rounded-2xl p-3.5 shadow-xl relative";

        let mediaHtml = '';
        if (post.media_url) {
          if (post.media_type === 'video') {
            mediaHtml = `
              <div class="rounded-xl overflow-hidden bg-black max-h-80 border border-[#232a42] mt-2.5">
                <video src="${post.media_url}" controls class="w-full max-h-80 object-cover"></video>
              </div>`;
          } else {
            mediaHtml = `
              <div class="rounded-xl overflow-hidden bg-black max-h-80 border border-[#232a42] mt-2.5 flex items-center justify-center">
                <img src="${post.media_url}" class="w-full object-cover">
              </div>`;
          }
        }

        // Админские действия
        let adminButtons = '';
        if (currentUser && currentUser.is_admin) {
          adminButtons = `
            <div class="flex items-center gap-1.5 ml-auto">
              <button onclick="adminDeletePost('${post.id}')" title="Удалить пост" class="p-1.5 rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white transition text-xs">
                <i class="fa-solid fa-trash"></i>
              </button>
              ${post.profiles?.id !== currentUser.id ? `
                <button onclick="adminBanUser('${post.profiles?.id}', '${post.profiles?.username}')" title="Забанить навсегда" class="p-1.5 rounded-lg bg-yellow-500/10 text-yellow-400 hover:bg-yellow-500 hover:text-black transition text-xs">
                  <i class="fa-solid fa-ban"></i>
                </button>
              ` : ''}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="flex items-center gap-2.5 mb-2">
            <img src="${post.profiles?.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80'}" class="w-9 h-9 rounded-full object-cover border border-purple-500/40">
            <div>
              <div class="flex items-center gap-1.5">
                <p class="font-bold text-sm text-gray-200">${post.profiles?.username || 'Аноним'}</p>
                ${post.profiles?.is_admin ? '<i class="fa-solid fa-crown text-yellow-400 text-xs" title="Администратор"></i>' : ''}
              </div>
              <p class="text-[10px] text-gray-500">${new Date(post.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
            </div>
            ${adminButtons}
          </div>
          ${post.text ? `<p class="text-sm text-gray-300 leading-relaxed">${post.text}</p>` : ''}
          ${mediaHtml}
        `;
        container.appendChild(card);
      });
    }

    // Функции создателя (Админа)
    window.adminDeletePost = async function(postId) {
      if (!confirm("Удалить этот пост?")) return;
      await supabaseClient.from('posts').delete().eq('id', postId);
      loadPosts();
    };

    window.adminBanUser = async function(userId, username) {
      if (!confirm(`Выдать пермач и бан пользователю ${username}?`)) return;
      await supabaseClient.from('profiles').update({ is_banned: true }).eq('id', userId);
      alert(`Пользователь ${username} забанен!`);
      loadPosts();
    };

    // Смена Аватарки и Баннера в профиле
    document.getElementById('avatar-file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const path = `avatars/${currentUser.id}_${Date.now()}.${file.name.split('.').pop()}`;
      await supabaseClient.storage.from('nyxflow-media').upload(path, file);
      const { data } = supabaseClient.storage.from('nyxflow-media').getPublicUrl(path);
      await supabaseClient.from('profiles').update({ avatar_url: data.publicUrl }).eq('id', currentUser.id);
      currentUser.avatar_url = data.publicUrl;
      localStorage.setItem('nyxflow_session', JSON.stringify(currentUser));
      applyUserUI();
    });

    document.getElementById('banner-file-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const path = `banners/${currentUser.id}_${Date.now()}.${file.name.split('.').pop()}`;
      await supabaseClient.storage.from('nyxflow-media').upload(path, file);
      const { data } = supabaseClient.storage.from('nyxflow-media').getPublicUrl(path);
      await supabaseClient.from('profiles').update({ banner_url: data.publicUrl }).eq('id', currentUser.id);
      currentUser.banner_url = data.publicUrl;
      localStorage.setItem('nyxflow_session', JSON.stringify(currentUser));
      applyUserUI();
    });

    // Сохранение настроек профиля (ник + Spotify)
    document.getElementById('save-profile-btn').addEventListener('click', async () => {
      const newUsername = document.getElementById('edit-username-input').value.trim();
      const spotifyUrl = document.getElementById('edit-spotify-input').value.trim();
      if (!newUsername) return alert("Ник не может быть пустым!");

      const { error } = await supabaseClient.from('profiles').update({
        username: newUsername,
        spotify_url: spotifyUrl
      }).eq('id', currentUser.id);

      if (error) return alert("Ошибка сохранения или ник занят!");
      currentUser.username = newUsername;
      currentUser.spotify_url = spotifyUrl;
      localStorage.setItem('nyxflow_session', JSON.stringify(currentUser));
      applyUserUI();
      alert("Профиль обновлен!");
    });

    // Навигация
    const navFeed = document.getElementById('nav-btn-feed');
    const navProfile = document.getElementById('nav-btn-profile');
    const feedPage = document.getElementById('feed-page');
    const profilePage = document.getElementById('profile-page');
    const postPanel = document.getElementById('post-creation-panel');

    navFeed.addEventListener('click', () => {
      feedPage.classList.remove('hidden');
      profilePage.classList.add('hidden');
      postPanel.classList.remove('hidden');
      navFeed.className = "flex items-center gap-2 text-xs font-bold text-purple-400 py-1.5 px-4 rounded-lg bg-purple-500/10";
      navProfile.className = "flex items-center gap-2 text-xs font-bold text-gray-400 py-1.5 px-4 rounded-lg hover:text-gray-200";
    });

    navProfile.addEventListener('click', () => {
      feedPage.classList.add('hidden');
      profilePage.classList.remove('hidden');
      postPanel.classList.add('hidden');
      navProfile.className = "flex items-center gap-2 text-xs font-bold text-purple-400 py-1.5 px-4 rounded-lg bg-purple-500/10";
      navFeed.className = "flex items-center gap-2 text-xs font-bold text-gray-400 py-1.5 px-4 rounded-lg hover:text-gray-200";
    });

    // Старт
    checkAuth();
  </script>
</body>
</html>
